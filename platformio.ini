; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ============================================================================
; DUAL BOARD ARCHITECTURE
; ============================================================================
; System: Raspberry Pi <--> Arduino Uno R3 <--> TTGO LoRa32 v1
; 
; Build commands:
;   pio run -e uno-main         # Build for Arduino Uno R3 (main controller)
;   pio run -e ttgo-lighting    # Build for TTGO LoRa32 (lighting controller)
;   pio run -e uno-main -t upload       # Upload to Uno
;   pio run -e ttgo-lighting -t upload  # Upload to TTGO
; ============================================================================

[env:uno-main]
; Arduino Uno R3 - Main Controller
; Handles: Servos, game logic, protocol routing to TTGO
platform = atmelavr
board = uno
framework = arduino
upload_port = COM12
monitor_port = COM12
monitor_speed = 115200
lib_ldf_mode = deep+
build_flags = 
    -DBOARD_MODE=1  ; MODE_MAIN_CONTROLLER
lib_deps = 
    SPI
    Wire
    adafruit/Adafruit BusIO@^1.16.2
    adafruit/Adafruit PWM Servo Driver Library@^3.0.3
    ; Note: NeoPixel NOT included - LED control on TTGO

[env:ttgo-lighting]
; TTGO LoRa32 v1 - Lighting Controller
; Handles: LED strips, OLED display, pattern generation
platform = espressif32
board = ttgo-lora32-v1
framework = arduino
upload_port = COM11
monitor_port = COM11
monitor_speed = 115200
lib_ldf_mode = deep+
build_flags = 
    -DBOARD_MODE=2  ; MODE_LIGHTING_CONTROLLER
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0
    adafruit/Adafruit SSD1306@^2.5.17
    adafruit/Adafruit GFX Library@^1.12.6
    adafruit/Adafruit BusIO@^1.16.2
    Wire
    ; Note: LoRa library NOT included (not needed for LED project)