; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ============================================================================
; DUAL BOARD ARCHITECTURE
; ============================================================================
; System: Raspberry Pi <--> Arduino Uno R3 <--> ESP32
;
; Build commands:
;   pio run -e uno-main          # Build for Arduino Uno R3 (main controller)
;   pio run -e esp32-lighting    # Build for ESP32 (lighting controller)
;   pio run -e uno-main -t upload        # Upload to Uno
;   pio run -e esp32-lighting -t upload  # Upload to ESP32
; ============================================================================

[env:uno-main]
; Arduino Uno R3 - Main Controller
; Handles: Servos, game logic, protocol routing to lighting controller
platform = atmelavr
board = uno
framework = arduino
upload_port = COM12
monitor_port = COM12
monitor_speed = 115200
lib_ldf_mode = deep+
build_flags =
    -DBOARD_MODE=1  ; MODE_MAIN_CONTROLLER
lib_deps =
    SPI
    Wire
    adafruit/Adafruit BusIO@^1.16.2
    adafruit/Adafruit PWM Servo Driver Library@^3.0.3
    ; Note: NeoPixel NOT included - LED control on lighting controller

[env:esp32-lighting]
; Stock ESP32 Dev Board - Lighting Controller
; Handles: LED strips (one GPIO pin per target), pattern generation
; No OLED, no LoRa - plain ESP32-WROOM-32 dev module
;
; LED GPIO -> Target mapping (must match LED_PINS[] in src/main.cpp):
;   GPIO4  -> Target 0      GPIO22 -> Target 6
;   GPIO13 -> Target 1      GPIO23 -> Target 7
;   GPIO14 -> Target 2      GPIO25 -> Target 8
;   GPIO18 -> Target 3      GPIO26 -> Target 9
;   GPIO19 -> Target 4      GPIO27 -> Target 10
;   GPIO21 -> Target 5      GPIO32 -> Target 11
; UART2 to Uno R3: GPIO16 = RX, GPIO17 = TX
; GPIO33 left free as a spare (avoids strapping pins 0/2/5/12/15,
; input-only pins 34-39, UART0 1/3, and flash pins 6-11)
platform = espressif32
board = esp32dev
framework = arduino
upload_port = COM11
monitor_port = COM11
monitor_speed = 115200
lib_ldf_mode = deep+
build_flags =
    -DBOARD_MODE=2  ; MODE_LIGHTING_CONTROLLER
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0